[project]
name = "poc-bancolombia"
version = "0.1.0"
description = "PoC DaaS Bancolombia (Pragma): pipeline U0-U7 de pronosticos de efectivo M1-M6, Anexo D y publicacion v0_provisional en S3"
readme = "README.md"
requires-python = "==3.11.*"
# Versiones exactas del venv ~/.venvs/poc-daas que genero el entregable (entrega/POC_Efectivo_PRAGMA.xlsx).
dependencies = [
    "pandas==2.3.3",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "pandera==0.34.0",
    "prophet==1.5.0",
    "cmdstanpy==1.3.0",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "joblib==1.6.0",
    "threadpoolctl==3.7.0",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "shap==0.51.0",
    "mlflow==3.17.1",
    "holidays==0.106",
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
    "psutil==7.2.2",
    "python-dateutil==2.9.0.post0",
    "boto3==1.43.106",
    "s3fs==2026.9.0",
    "jsonschema==4.26.0",
]

[tool.uv]
# daas no se instala: corre por PYTHONPATH (pipeline/corrida_entrega.sh), igual que en la corrida original.
package = false
# Lock probado solo en macOS arm64 (la resolucion universal falla con shap==0.51.0 en otras plataformas).
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Freeze completo del venv que produjo los resultados: fija tambien las dependencias transitivas.
