# conf/dq_rules.yml - Catalogo de reglas de calidad V-01..V-12 (§3.2) + Anexo C (§3.3)
#
# La SEMANTICA de las reglas sigue la tabla §3.2 del documento de arquitectura
# (fuente de verdad), no una numeracion previa divergente del YAML. Cada regla
# declara dimension, severidad y accion. Las validaciones concretas las
# implementa src/daas/quality/checks.py; la compuerta vive en quality/report.py.
#
# Accion:  cuarentena = la fila no conforme sale de processed/ y va a
#          daas://quality/rejected/<dataset>;  marcar = se anota una bandera y
#          la fila continua (p.ej. holdout, missing_anexo_c, outlier marcado).

reglas:
  V-01:
    descripcion: Validez de esquema estructural (columnas/tipos/obligatoriedad).
    dimension: validez
    severidad: critica
    accion: cuarentena
  V-02:
    descripcion: Completitud de llaves y campos obligatorios por contrato.
    dimension: completitud
    severidad: critica
    accion: cuarentena
  V-03:
    descripcion: Unicidad de la llave primaria del contrato.
    dimension: unicidad
    severidad: critica
    accion: cuarentena
  V-04:
    descripcion: Dominio valido de valores categoricos (p.ej. ciudad, tipo_den).
    dimension: validez
    severidad: alta
    accion: cuarentena
  V-05:
    descripcion: Rango valido de valores numericos (p.ej. montos >= 0).
    dimension: validez
    severidad: alta
    accion: marcar
  V-06:
    descripcion: Integridad referencial entre contratos (FK -> maestro/dim_fondo).
    dimension: consistencia
    severidad: alta
    accion: marcar
  V-07:
    descripcion: Corte temporal 31-ago-2026; lo posterior se separa a holdout.
    dimension: consistencia
    severidad: alta
    accion: marcar
  V-08:
    descripcion: Anexo C - los 27 dias quedan NULL con missing_anexo_c (nunca 0).
    dimension: completitud
    severidad: critica
    accion: marcar
  V-09:
    descripcion: Reconciliacion de desinstalados (RN-07) contra snapshot vigente.
    dimension: consistencia
    severidad: alta
    accion: marcar
  V-10:
    descripcion: Cardinalidad de fondos (dim_fondo == 6); fatal si difiere.
    dimension: consistencia
    severidad: critica
    accion: fatal
  V-11:
    descripcion: Cobertura temporal/por modelo segun cobertura_por_modelo.
    dimension: completitud
    severidad: alta
    accion: marcar
  V-12:
    descripcion: Consistencia cruzada (p.ej. universo Clientes vs esperado).
    dimension: consistencia
    severidad: media
    accion: marcar

