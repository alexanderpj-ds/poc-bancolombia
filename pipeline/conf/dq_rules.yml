# Cobertura esperada de fondos por modelo (§3.3).
# FONDO = CIUDAD|TRANSPORTADORA (6 fondos en total).
cobertura_por_modelo:
  M1: 5
  M2: 5
  M3: 5
  M4: 6
  M5: 6
  M6: 6

# ---------------------------------------------------------------------------
# Supuestos de cliente PARAMETRIZABLES (NO inventar; default documentado).
# El codigo lee de aqui y, si la clave falta, aplica el default conservador
# tambien documentado en el modulo correspondiente. Ver reports/u0_profiling.md.
# ---------------------------------------------------------------------------

# P24 - vigencia del universo de Clientes (M5).
# Perfilado: ~529 cod_punto reales vs 344 esperados. Default: NO filtrar
# (conservar el universo presente); V-12 reporta la discrepancia. Depende de
# confirmacion del cliente (P24).
clientes_vigencia:
  regla: ninguna          # ninguna | ultimo_hasta_corte (cuando el cliente confirme)
  universo_esperado: 344
  nota: "P24 pendiente; universo real ~529 vs 344 esperado - no confirmado."

# RN-07 - reconciliacion de ATM desinstalados.
# 29 de 491 ATM activos figuran tambien en cp_desinstalados (llave COD).
# Default conservador: un ATM se considera desinstalado solo si NO esta en el
# snapshot vigente de cp_historico (prioridad al maestro vigente). Los conflictos
# se registran en el reporte DQ (V-09), no se excluyen a ciegas.
rn07_reconciliacion:
  prioridad: snapshot_vigente   # snapshot_vigente | fecha_desinstalacion
  nota: "OD-6; registra los conflictos activo-y-desinstalado en el reporte DQ."

# M6 - denominaciones/divisa y saldo inicial.
# Denominaciones obligatorias; excluir 1000, monedas y divisa ($XXXAF/NF).
m6_denominaciones: [100000, 50000, 20000, 10000, 5000, 2000]
m6_excluir: [1000, MONEDA, DIVISA]
m6_saldo_inicial:
  regla: ultimo_disponible_hasta_corte
  nota: "Saldo inicial M6 = ultimo disponible <= 31-ago-2026 por (fondo_id, denominacion)."
