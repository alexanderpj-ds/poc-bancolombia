# Hipótesis: + el cajero como variable categórica (codificación ordenada en el tiempo).
# El efecto de la hipótesis es cat_cal contra cat_cal_ctrl, no contra gbm_cal.
familia: cat_global
entidad_categorica: true
grupos: [base, calendario, pago, dom_entidad]
paso_dias: 5
meses_entrenamiento: 18
dias_pago: [15, fin]
cat: {iterations: 300, learning_rate: 0.06, depth: 6}   # sin búsqueda: mismo nº de árboles y tasa que gbm_cal
